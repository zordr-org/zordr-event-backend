services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    command: npm run start:dev
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    command: npm run start:worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata: